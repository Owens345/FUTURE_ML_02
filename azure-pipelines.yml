# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'

steps:
# Step 1: Use the specified Python version
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
  displayName: 'Use Python $(pythonVersion)'

# Step 2: Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

# Step 3: Run unit tests (if you have tests)
- script: |
    pytest tests/
  displayName: 'Run Unit Tests'
  continueOnError: true  # Optional: continue even if tests fail for now

# Step 4: Run training script
- script: |
    python train.py
  displayName: 'Train ML Model'

# Step 5: Publish the trained model (e.g., model.pkl) as a pipeline artifact
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/model.pkl'
    artifact: 'trained-model'
    publishLocation: 'pipeline'
  displayName: 'Publish Trained Model Artifact'

